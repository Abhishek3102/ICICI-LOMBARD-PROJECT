# SonarCloud / SonarQube project configuration
sonar.projectKey=claimguard-ai
sonar.projectName=ClaimGuard AI
sonar.projectVersion=1.0

sonar.sources=backend/src,app,components,lib
sonar.tests=backend/tests,__tests__
sonar.test.inclusions=**/*Tests.cs,**/*.test.ts,**/*.test.tsx

sonar.exclusions=**/bin/**,**/obj/**,**/node_modules/**,**/.next/**,**/coverage/**

sonar.cs.dotnet.test.reportsPaths=test-results/**/*.trx
sonar.javascript.lcov.reportPaths=coverage/lcov.info

sonar.qualitygate.wait=true
